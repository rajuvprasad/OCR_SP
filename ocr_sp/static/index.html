<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handwriting OCR</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  #drop { border: 2px dashed #999; border-radius: 10px; padding: 2rem; text-align: center; cursor: pointer; }
  #drop.over { background: #eef4ff; border-color: #3a6ff7; }
  button { margin-top: 1rem; padding: .6rem 1.2rem; font-size: 1rem; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-top: 1rem; display: flex; gap: 1rem; }
  .card { flex-direction: column; }
  .card img { max-width: 100%; max-height: 520px; object-fit: contain; }
  pre { white-space: pre-wrap; margin: 0; flex: 1; }
</style>
</head>
<body>
<h1>Handwriting OCR</h1>
<p>Upload photos or scans of handwritten text or numbers.</p>
<div id="drop">Drop images here or click to choose
  <input id="file" type="file" accept="image/*" multiple hidden>
</div>
<p>
  <label><input type="radio" name="mode" value="scene" checked> Photo: text anywhere in the picture (e.g. numbers on materials)</label><br>
  <label><input type="radio" name="mode" value="page"> Handwritten page / notes</label>
</p>
<label id="digitsRow"><input id="digits" type="checkbox" checked> Numbers only</label>
<label id="singleRow" hidden><input id="single" type="checkbox"> Each image is a single line</label><br>
<button id="go" disabled>Recognise</button>
<p id="status"></p>
<div id="out"></div>
<script>
const drop = document.getElementById('drop'), input = document.getElementById('file');
const go = document.getElementById('go'), status = document.getElementById('status'), out = document.getElementById('out');
let files = [];
const mode = () => document.querySelector('input[name=mode]:checked').value;
document.querySelectorAll('input[name=mode]').forEach(r => r.onchange = () => {
  document.getElementById('digitsRow').hidden = mode() !== 'scene';
  document.getElementById('singleRow').hidden = mode() !== 'page';
});
function setFiles(list) { files = [...list].filter(f => f.type.startsWith('image/')); go.disabled = !files.length;
  status.textContent = files.length ? `${files.length} image(s) selected` : ''; }
drop.onclick = () => input.click();
input.onchange = () => setFiles(input.files);
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); setFiles(e.dataTransfer.files); };
go.onclick = async () => {
  const fd = new FormData(); files.forEach(f => fd.append('files', f));
  go.disabled = true; status.textContent = 'Recognising… (first run downloads the model)'; out.innerHTML = '';
  try {
    const q = new URLSearchParams({ mode: mode(), digits_only: document.getElementById('digits').checked,
                                     single_line: document.getElementById('single').checked });
    const r = await fetch(`/api/recognize?${q}`, { method: 'POST', body: fd });
    const body = await r.json();
    if (!r.ok) throw new Error(body.detail || r.statusText);
    body.results.forEach((res, i) => {
      const card = document.createElement('div'); card.className = 'card';
      const img = document.createElement('img'); img.src = res.annotated || URL.createObjectURL(files[i]);
      const pre = document.createElement('pre'); pre.textContent = `${res.filename}\n\n${res.text || '(no text found)'}`;
      card.append(img, pre); out.append(card);
    });
    status.textContent = 'Done';
  } catch (e) { status.textContent = 'Error: ' + e.message; }
  go.disabled = false;
};
</script>
</body>
</html>
